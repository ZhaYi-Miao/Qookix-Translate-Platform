<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QookiX Launcher 翻译缓存系统</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<style>
  :root {
    --bg:#f5f6f8; --panel:#fff; --panel-2:#fafbfc; --border:#e3e6ea; --border-2:#eef1f4;
    --text:#1f2328; --text-2:#3c4149; --muted:#656d76; --faint:#8b949e;
    --accent:#2563eb; --accent-2:#1d4ed8; --accent-soft:#eef2ff;
    --good:#1a7f37; --warn:#9a6700; --bad:#cf222e;
    --sidebar:#fff; --nav-hover:#f3f4f6; --chart-grid:#eef1f4;
    --code-bg:#f6f8fa; --code-fg:#24292f; --shadow:none;
  }
  [data-theme="dark"] {
    --bg:#0f1115; --panel:#15181d; --panel-2:#1a1e24; --border:#2b3038; --border-2:#22262d;
    --text:#e6edf3; --text-2:#c9d1d9; --muted:#8b949e; --faint:#6e7681;
    --accent:#58a6ff; --accent-2:#79b8ff; --accent-soft:#1b2330;
    --good:#3fb950; --warn:#d29922; --bad:#f85149;
    --sidebar:#12151a; --nav-hover:#1c2027; --chart-grid:#262b33;
    --code-bg:#0d1117; --code-fg:#c9d1d9; --shadow:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:196px;flex:0 0 196px;background:var(--sidebar);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:14px 10px}
  .logo{display:flex;align-items:center;gap:8px;padding:2px 8px 14px}
  .logo .mark{width:26px;height:26px;border-radius:6px;display:block;flex:0 0 26px;object-fit:contain}
  .logo .name{font-size:13.5px;font-weight:600;letter-spacing:.01em}
  .logo .sub{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:1px}
  nav{display:flex;flex-direction:column;gap:1px;margin-top:6px}
  nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:5px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;transition:background .12s,color .12s;border-left:2px solid transparent}
  nav a svg{width:15px;height:15px;flex:0 0 15px;opacity:.85}
  nav a:hover{background:var(--nav-hover);color:var(--text)}
  nav a.active{background:var(--nav-hover);color:var(--text);font-weight:600;border-left-color:var(--accent)}
  nav a.active svg{opacity:1;color:var(--accent)}
  .sidebar .foot{margin-top:auto;padding:8px 4px;display:flex;flex-direction:column;gap:6px}
  .sidebar .foot .hint{font-size:11px;color:var(--faint);line-height:1.5}
  .main{flex:1;min-width:0;padding:16px 22px 40px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .topbar h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .topbar .updated{font-size:12px;color:var(--muted);margin-top:2px}
  .topbar-left,.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .view{display:none}
  .view.active{display:block}
  @media(max-width:920px){
    .sidebar{width:52px;flex-basis:52px;padding:10px 6px}
    .logo .name,.logo .sub,nav a .lbl,.sidebar .foot{display:none}
    nav a{justify-content:center;padding:8px;border-left-width:0}
    .main{padding:12px 12px 40px}
  }
  button{padding:5px 11px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500;transition:background .12s,border-color .12s;font-family:inherit}
  button:hover{background:var(--panel-2);border-color:var(--faint)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  button.danger{background:transparent;color:var(--bad);border-color:var(--border)}
  button.danger:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
  button.ghost{background:transparent;border:none;color:var(--muted);padding:2px 5px}
  button.ghost:hover{background:var(--nav-hover);color:var(--text)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.sm{padding:3px 8px;font-size:12px}
  input[type="text"],input[type="password"],input[type="number"]{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;background:var(--panel);color:var(--text);font-family:inherit}
  input[type="text"],input[type="password"]{font-family:Menlo,Consolas,monospace}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  select{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;background:var(--panel);color:var(--text);font-family:inherit}
  label{font-size:12.5px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;margin-bottom:14px;background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .metric{background:var(--panel);padding:12px 14px}
  .metric .label{font-size:12px;color:var(--muted);font-weight:400;margin-bottom:2px}
  .metric .value{font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .metric .value.good{color:var(--good)}.metric .value.warn{color:var(--warn)}.metric .value.bad{color:var(--bad)}
  .metric .value.small{font-size:16px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:12px}
  .panel h2{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .panel h2 .sub{font-size:11.5px;color:var(--faint);font-weight:400}
  .panel h2 .sub a{color:var(--accent);text-decoration:none}
  .panel a{color:var(--accent);text-decoration:none}
  .panel a:hover{text-decoration:underline}
  .about-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px solid var(--border-2)}
  .about-meta .hint{font-size:11.5px;color:var(--faint)}
  a.repo{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);text-decoration:none;padding:3px 9px;border:1px solid var(--border);border-radius:5px;background:var(--panel-2)}
  a.repo:hover{text-decoration:none;border-color:var(--accent);background:var(--accent-soft)}
  a.repo svg{width:13px;height:13px;flex:0 0 13px;fill:currentColor;opacity:.9}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  @media(max-width:980px){.grid-2{grid-template-columns:1fr}}
  canvas{max-height:230px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--border-2)}
  th{background:var(--panel-2);color:var(--muted);font-weight:500;font-size:11.5px;white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel-2)}
  .empty{color:var(--faint);font-style:normal;text-align:center;padding:16px;font-size:12.5px}
  .mono{font-family:Menlo,Consolas,monospace;font-size:12px}
  .breaker-banner{padding:8px 12px;border-radius:6px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:500;border:1px solid var(--border);border-left-width:3px;flex-wrap:wrap;gap:6px;background:var(--panel)}
  .breaker-banner.ok{border-left-color:var(--good);color:var(--text-2)}
  .breaker-banner.open{border-left-color:var(--bad);color:var(--bad)}
  .breaker-banner.warn{border-left-color:var(--warn);color:var(--warn)}
  .breaker-banner .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:middle;background:currentColor}
  .breaker-banner.open .dot{animation:pulse 1.6s infinite}
  .breaker-banner .details{font-size:12px;font-weight:400;color:var(--muted)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .worker-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .worker-toolbar label{display:flex;align-items:center;gap:7px;cursor:pointer}
  .worker-toolbar input[type="checkbox"]{width:15px;height:15px;accent-color:var(--accent)}
  .hint{font-size:12px;color:var(--muted)}
  /* 实时槽位：一个方块 = 一个并发槽位；在飞=实心，等名额=斜纹 */
  .live-row{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--border)}
  .live-row:first-child{border-top:0}
  .live-name{font-size:12.5px;font-weight:600;color:var(--text-2)}
  .live-name .sub{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:1px}
  .slots{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:5px}
  .sl{width:14px;height:14px;border-radius:3px;background:var(--panel-2);border:1px solid var(--border);display:inline-block}
  .sl.b{background:var(--accent);border-color:var(--accent)}
  .sl.w{background:repeating-linear-gradient(45deg,var(--panel-2),var(--panel-2) 3px,var(--muted) 3px,var(--muted) 5px)}
  .live-tags{display:flex;gap:6px;flex-wrap:wrap}
  .live-tag{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .live-tag.warn{background:rgba(234,88,12,.12);color:#c2410c;border-color:transparent}
  .live-tag.bad{background:rgba(220,38,38,.12);color:var(--bad);border-color:transparent}
  .live-tag.ok{background:rgba(26,127,55,.12);color:var(--good);border-color:transparent}
  .live-tag.idle{background:transparent;color:var(--faint)}
  .progress-bar-bg{width:100%;height:14px;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
  .progress-bar-fill{height:100%;background:var(--accent);transition:width .3s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:600}
  .speed-line{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin-top:6px;font-size:12.5px;color:var(--muted)}
  .speed-line strong{font-size:14px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  .speed-line .src{font-size:11.5px;color:var(--faint)}
  .worker-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;margin-top:10px;background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .worker-stat{padding:9px 12px;background:var(--panel)}
  .worker-stat .lbl{font-size:11.5px;color:var(--muted)}
  .worker-stat .val{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .running-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:6px;animation:pulse 1.6s infinite}
  pre.log,#logs_pre,#worker_recent{max-height:520px;overflow:auto;background:var(--code-bg);color:var(--code-fg);font-family:Menlo,Consolas,monospace;font-size:12px;padding:12px;border:1px solid var(--border);border-radius:6px;line-height:1.65;margin:0;white-space:pre-wrap;word-break:break-all}
  #worker_recent{max-height:220px}
  .lg-bad{color:#cf222e}
  .lg-warn{color:#9a6700}
  .lg-ok{color:#1a7f37}
  .lg-dim{color:var(--faint)}
  [data-theme="dark"] .lg-bad{color:#ff7b72}
  [data-theme="dark"] .lg-warn{color:#e3b341}
  [data-theme="dark"] .lg-ok{color:#7ee787}
  .provider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:12px}
  .provider-card{border:1px solid var(--border);border-radius:6px;padding:12px;background:var(--panel)}
  .provider-card .pc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
  .provider-card .pc-name-input{flex:1 1 110px;min-width:0;font-weight:600;font-size:13px;padding:4px 7px}
  .provider-card .pc-actions{display:flex;gap:4px;align-items:center}
  .provider-card .pc-field{display:grid;grid-template-columns:84px 1fr;gap:5px 9px;align-items:center;margin-bottom:7px}
  .provider-card .pc-field label{font-size:11.5px;color:var(--muted);text-align:right}
  .provider-card .pc-model-list{display:flex;flex-direction:column;gap:5px}
  .provider-card .pc-model-row{display:flex;gap:5px;align-items:center}
  .provider-card .pc-model-row input{flex:1 1 auto;min-width:0}
  .type-tag{font-size:10.5px;padding:1px 6px;border-radius:3px;font-weight:600;letter-spacing:.02em}
  .type-tag.openai{background:var(--accent-soft);color:var(--accent)}
  .type-tag.gemini{background:rgba(139,92,246,.12);color:#7c3aed}
  .key-badge{font-size:11px;color:var(--good)}
  .chain-list{display:flex;flex-direction:column;gap:6px}
  .chain-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 9px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px}
  .chain-row .cf-order{flex:0 0 18px;font-weight:600;color:var(--faint);text-align:center;font-size:12px}
  .chain-row .cf-ctrl{flex:0 0 auto;display:flex;gap:1px;align-items:center;margin-left:auto}
  .chain-row label{font-size:10.5px;color:var(--faint);display:block;margin-bottom:1px}
  .chain-row .cf-field{min-width:120px}
  .chain-row .cf-provider{flex:1 1 140px}
  .chain-row .cf-model{flex:2 1 190px}
  .chain-row .cf-limit,.chain-row .cf-outtok{flex:1 1 120px}
  .chain-row .cf-share{flex:0 1 100px}
  .chain-row .cf-rpm{flex:0 1 90px}
  .chain-row .cf-cool{flex:0 1 110px}
  .cf-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .preheat-box{margin-top:10px;border:1px solid var(--border);border-radius:6px;padding:2px 10px}
  .preheat-box:empty{display:none}
  .preheat-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:7px 0;border-top:1px solid var(--border)}
  .preheat-row:first-child{border-top:none}
  .preheat-row label{display:flex;align-items:center;gap:6px;min-width:118px}
  #config_result{font-size:12.5px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row #q{flex:1;min-width:200px}
  .preview{color:var(--muted);max-width:420px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tag{display:inline-block;padding:0 6px;border-radius:3px;font-size:11px;font-weight:600}
  .tag.desc{background:var(--accent-soft);color:var(--accent)}
  .tag.body{background:rgba(26,127,55,.12);color:var(--good)}
  .tag.src-mr{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .badge{display:inline-block;min-width:16px;padding:0 5px;margin-left:auto;border-radius:8px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:600;line-height:16px;text-align:center}
  .fb-feedback{max-width:300px;font-size:12px;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
  .fb-feedback em{color:var(--faint);font-style:normal}
  .fb-actions{white-space:nowrap;text-align:right}
  .fb-actions button{margin-left:3px}
  .st{border-radius:3px;padding:1px 6px;font-size:11px;font-weight:600;white-space:nowrap}
  .st.pending{background:rgba(154,103,0,.12);color:var(--warn)}
  .st.retranslating{background:var(--accent-soft);color:var(--accent)}
  .st.done{background:rgba(26,127,55,.12);color:var(--good)}
  .st.failed{background:rgba(207,34,46,.12);color:var(--bad)}
  .st.ignored{background:var(--panel-2);color:var(--faint);border:1px solid var(--border)}
  .fb-cache{font-size:11.5px;color:var(--faint);white-space:nowrap}
  .fb-cache b{color:var(--good);font-weight:600}
  .fb-select{width:15px;height:15px;accent-color:var(--accent)}
  .auth-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:6px}
  .auth-item{display:flex;align-items:center;gap:8px;padding:5px 9px;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:12px}
  .auth-item:hover{background:var(--panel-2)}
  .auth-item span{display:flex;flex-direction:column;min-width:0}
  .auth-item b{font-family:Menlo,Consolas,monospace;font-size:11.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
  .auth-item em{font-style:normal;color:var(--faint);font-size:11px}
  .auth-item input{width:15px;height:15px;accent-color:var(--accent);flex:0 0 15px}
  .pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:1000px){.detail-grid{grid-template-columns:1fr}}
  .col{border:1px solid var(--border);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
  .col.active{border-color:var(--accent)}
  .colhead{padding:7px 12px;background:var(--panel-2);border-bottom:1px solid var(--border);font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .colhead .sub{font-size:11.5px;color:var(--faint);font-weight:400}
  .md{padding:14px;overflow:auto;max-height:600px;font-size:13.5px;line-height:1.75;word-break:break-word}
  .md.raw{white-space:pre-wrap;font-family:Menlo,Consolas,monospace;font-size:12px}
  .md h1,.md h2,.md h3,.md h4{margin:14px 0 7px;font-weight:600;line-height:1.35}
  .md h1{font-size:19px}.md h2{font-size:17px}.md h3{font-size:15px}.md h4{font-size:13.5px}
  .md p{margin:9px 0}
  .md ul,.md ol{margin:9px 0 9px 20px}
  .md li{margin:3px 0}
  .md a{color:var(--accent)}
  .md img{max-width:100%;height:auto;border-radius:4px;margin:8px 0}
  .md code{background:var(--panel-2);border:1px solid var(--border);padding:1px 4px;border-radius:3px;font-family:Menlo,Consolas,monospace;font-size:12px}
  .md pre{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:11px;overflow:auto;margin:9px 0}
  .md pre code{background:none;border:none;padding:0}
  .md blockquote{border-left:3px solid var(--border);padding-left:11px;color:var(--muted);margin:9px 0}
  .md hr{border:none;border-top:1px solid var(--border);margin:13px 0}
</style>
</head>
<body>
